name: Sauce Labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saucelabs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
      SAUCE_ANDROID_DEVICE: ${{ vars.SAUCE_ANDROID_DEVICE || 'Samsung Galaxy A23 5G' }}
      SAUCE_ANDROID_OS: ${{ vars.SAUCE_ANDROID_OS || '13' }}
      SAUCE_APPIUM_VERSION: ${{ vars.SAUCE_APPIUM_VERSION || 'appium3-2026-10' }}
      SAUCE_ANDROID_APP: ${{ secrets.SAUCE_ANDROID_APP }}
      BUILD_NAME: triparc-${{ github.run_id }}-android
    steps:
      - uses: actions/checkout@v6
      - name: Set build date
        run: echo "BUILD_NAME=triparc-$(date -u +%Y-%m-%d)-android" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:cloud:android
      - name: Build Allure report
        if: always()
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: artifacts/
          retention-days: 7

  ios:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
      SAUCE_IOS_DEVICE: ${{ vars.SAUCE_IOS_DEVICE || 'iPhone 13 Pro' }}
      SAUCE_IOS_OS: ${{ vars.SAUCE_IOS_OS || '18' }}
      SAUCE_APPIUM_VERSION: ${{ vars.SAUCE_APPIUM_VERSION || 'appium3-2026-10' }}
      SAUCE_IOS_APP: ${{ secrets.SAUCE_IOS_APP }}
      BUILD_NAME: triparc-${{ github.run_id }}-ios
    steps:
      - uses: actions/checkout@v6
      - name: Set build date
        run: echo "BUILD_NAME=triparc-$(date -u +%Y-%m-%d)-ios" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:cloud:ios
      - name: Build Allure report
        if: always()
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: artifacts/
          retention-days: 7
