name: Android Sauce Labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
      SAUCE_ANDROID_DEVICE: ${{ vars.SAUCE_ANDROID_DEVICE || 'Samsung Galaxy A23 5G' }}
      SAUCE_ANDROID_OS: ${{ vars.SAUCE_ANDROID_OS || '13' }}
      SAUCE_APPIUM_VERSION: ${{ vars.SAUCE_APPIUM_VERSION || 'appium3-2026-10' }}
      BUILD_NAME: triparc-${{ github.run_id }}-android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run apps:download -- android
      - run: npm run cloud:upload -- android
      - run: npm run test:cloud:android
      - name: Build Allure report
        if: always()
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: artifacts/
          retention-days: 7
